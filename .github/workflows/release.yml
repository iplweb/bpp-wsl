name: release

# Buduje na Linuksie mini instalator BPP-Setup-<wersja>.exe, program BPP-<wersja>.exe i rootfs
# bpp-rootfs-<wersja>.tar.gz i publikuje je w GitHub Releases pod tagiem v<wersja>. Mini instalator pobiera dwa
# pozostale pliki z TEGO wydania (adresy i sumy SHA-256 sa wkompilowane), wiec wszystkie trzy musza tu byc.
# Uwaga: szkic (draft) nie udostepnia plikow publicznie — z szkicu mini instalator nic nie pobierze.
# - push tagu v<wersja> (np. v0.1.1): wersja z tagu, tag obrazow ze zmiennej repo BPP_IMAGE_TAG,
# - recznie (Actions -> release -> Run workflow): wersja i opcjonalnie tag obrazow z formularza.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Wersja instalatora (N.N.N, opcjonalnie z sufiksem, np. 0.1.1 lub 0.2.0-rc1)"
        required: true
      image_tag:
        description: "Tag obrazow iplweb/bpp_* (puste = zmienna repo BPP_IMAGE_TAG)"
        required: false
      draft:
        description: "Szkic zamiast publikacji (do testow workflow)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      IMAGE_TAG: ${{ inputs.image_tag || vars.BPP_IMAGE_TAG }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: installer/global.json

      - name: Parametry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${VERSION#v}"
          # Istniejacego wydania nie budujemy ponownie: rootfs nie jest powtarzalny, wiec nowe pliki mialyby inne
          # sumy SHA-256 niz te wkompilowane w rozdane juz BPP-Setup-<wersja>.exe. Poprawka = nowy numer wersji.
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Wydanie v$VERSION juz istnieje. Uzyj nowego numeru wersji (albo usun szkic wydania)." >&2
            exit 1
          fi
          if [[ -z "$IMAGE_TAG" ]]; then
            echo "::error::Brak tagu obrazow: ustaw zmienna repo BPP_IMAGE_TAG albo podaj image_tag." >&2
            exit 1
          fi
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Nieprawidlowy tag obrazow: $IMAGE_TAG" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Wersja: $VERSION, obrazy: $IMAGE_TAG"

      - name: Testy jednostkowe
        run: dotnet test installer -c Release

      - name: Testy dystrybucji (bats)
        run: build/test-distro.sh

      - name: Build
        run: BPP_GITHUB_REPO="$GITHUB_REPOSITORY" build/build.sh "$IMAGE_TAG" "$VERSION"

      - name: Kontrola plikow wydania
        run: |
          (cd dist && sha256sum -c SHA256SUMS.txt)
          ls -l "dist/BPP-Setup-$VERSION.exe" "dist/BPP-$VERSION.exe" "dist/bpp-rootfs-$VERSION.tar.gz"

      - name: Publikacja w Releases
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft && '--draft' || '' }}
        run: |
          tag="v$VERSION"
          # Wersja N.N.N to zwykle wydanie ("latest" na GitHubie pomija pre-release i szkice); wersja z sufiksem
          # (np. 0.3.0-rc1) wychodzi jako pre-release.
          PRE=""
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then PRE="--prerelease"; fi
          files=("dist/BPP-Setup-$VERSION.exe" "dist/BPP-$VERSION.exe" "dist/bpp-rootfs-$VERSION.tar.gz" dist/SHA256SUMS.txt)
          notes="$(printf 'Instalator BPP dla Windows %s (obrazy BPP `%s`).\n\nPobierz `BPP-Setup-%s.exe` ponizej (maly plik, kilkadziesiat KB) i uruchom dwuklikiem — sam pobierze z tego wydania program `BPP-%s.exe` i dystrybucje `bpp-rootfs-%s.tar.gz`. Bez dostepu do GitHuba: pobierz wszystkie trzy pliki i poloz je w jednym folderze. Instrukcja: [README](https://github.com/%s#instalacja-krok-po-kroku).\n\nPlik nie jest podpisany: Windows SmartScreen pokaze ostrzezenie (Wiecej informacji -> Uruchom mimo to).\n\n[Polityka prywatnosci / Privacy policy](https://github.com/%s/blob/main/PRIVACY.md)\n\n```\n%s\n```\n' \
            "$VERSION" "$IMAGE_TAG" "$VERSION" "$VERSION" "$VERSION" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" "$(cat dist/SHA256SUMS.txt)")"
          gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" $PRE $DRAFT \
            --title "BPP dla Windows $VERSION (testowe)" --notes "$notes"

      # Link "Pobierz" w README prowadzi prosto do BPP-Setup-<wersja>.exe (wersja w nazwie pliku), wiec po kazdym
      # zwyklym wydaniu trzeba go przestawic. Nie dla szkicow i wersji z sufiksem (pre-release).
      - name: README - link do nowego wydania
        if: ${{ !inputs.draft }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Wersja $VERSION to pre-release: README bez zmian."
            exit 0
          fi
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B readme-link "origin/$DEFAULT_BRANCH"
          sed -i -E "/^\*\*\[⬇ Pobierz/ s#BPP-Setup-[0-9][^\`)]*\.exe#BPP-Setup-$VERSION.exe#g; /^\*\*\[⬇ Pobierz/ s#/releases/download/v[^/]+/#/releases/download/v$VERSION/#" README.md
          if ! grep -qF "/releases/download/v$VERSION/BPP-Setup-$VERSION.exe" README.md; then
            echo "::error::Nie znaleziono w README wiersza z linkiem 'Pobierz' - popraw link recznie." >&2
            exit 1
          fi
          if git diff --quiet; then echo "README juz wskazuje v$VERSION."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "docs: download link for v$VERSION" README.md
          git push origin "HEAD:$DEFAULT_BRANCH"
