# Nieprzetestowane: repo nie ma jeszcze zdalnego GitHuba (patrz README.md).
name: build

on:
  push:
  pull_request:

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: installer/global.json
      - name: Testy jednostkowe
        run: dotnet test installer -c Release
      - name: Build
        run: dotnet build installer/BPP.sln -c Release
      - name: Publish BPP.exe
        run: >
          dotnet publish installer/src/BPP.Tray -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -o dist/tray
      - name: Smoke - nieznany argument konczy sie kodem 2 bez UI
        shell: pwsh
        run: |
          foreach ($a in @('--bogus', '--setup --bogus')) {
            $p = Start-Process -FilePath dist\tray\BPP.exe -ArgumentList $a -Wait -PassThru
            if ($p.ExitCode -ne 2) { throw "BPP.exe $a`: oczekiwano kodu 2, jest $($p.ExitCode)" }
          }
      - name: Mini instalator - rozmiar i manifest asInvoker
        shell: pwsh
        run: |
          $exe = 'installer\src\BPP.Bootstrap\bin\Release\net48\BPP-Setup.exe'
          $size = (Get-Item $exe).Length
          Write-Host "BPP-Setup.exe: $size B"
          if ($size -gt 200KB) { throw "Mini instalator urosl do $size B" }
          if (-not (Select-String -Path $exe -Pattern 'asInvoker' -SimpleMatch -Quiet)) { throw "Brak manifestu asInvoker" }
