# nginx dla dystrybucji BPP (WSL): TLS na 443 (publikowany jako 8443), bez HSTS.
worker_processes 1; # wersja testowa: jeden proces
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Resolver Dockera + upstream przez zmienna: nginx startuje przed appserverem.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Wewnetrzny healthcheck (port 80 nie jest publikowany).
    server {
        listen 80;
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }
    }

    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 100m;

        location /static/ {
            alias /var/www/html/staticroot/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /var/www/html/mediaroot/;
            expires 7d;
            add_header Cache-Control "public";

            # Blokada wykonywania/serwowania wgranych skryptow
            location ~* \.(php|php3|php4|php5|php7|phtml|pl|py|pyc|pyo|sh|cgi|rb|asp|aspx|exe|com|bat|dll|vbs|js|jar|jsp|jspx)$ {
                deny all;
            }
        }

        # Pliki chronione (django-sendfile): tylko przez X-Accel-Redirect z aplikacji.
        location /media/protected/ {
            internal;
            alias /var/www/html/mediaroot/protected/;
        }

        location / {
            set $upstream http://appserver:8000;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_hide_header Strict-Transport-Security;
            proxy_read_timeout 300s;
        }
    }
}
